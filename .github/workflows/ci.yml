name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore Mercadinho.slnx

      - name: Compilar
        run: dotnet build Mercadinho.slnx --no-restore -c Release

      - name: Testar
        run: dotnet test Mercadinho.slnx --no-build -c Release --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem da API
        run: docker build -t gerentall-api .
