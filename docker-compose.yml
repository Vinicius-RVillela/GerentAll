services:
  db:
    image: mariadb:11.4          # versão LTS (suporte longo)
    restart: unless-stopped
    environment:
      # O banco gerentall é criado pelo script de estrutura (montado abaixo).
      MARIADB_DATABASE: gerentall
      MARIADB_USER: ${MARIADB_USER:-gerentall_app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?defina MARIADB_PASSWORD no arquivo .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?defina MARIADB_ROOT_PASSWORD no arquivo .env}
    ports:
      # Só este computador acessa o banco (127.0.0.1). A porta 3307 do lado de
      # fora evita conflito com um MariaDB já instalado na 3306.
      - "127.0.0.1:3307:3306"
    volumes:
      - dados_mariadb:/var/lib/mysql
      # Na PRIMEIRA vez que o volume é criado, o MariaDB roda este script:
      # tabelas, triggers e views do GerentAll. Depois disso ele não roda mais.
      - ./database/mariadb/01_estrutura.sql:/docker-entrypoint-initdb.d/01_estrutura.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Server=db;Port=3306;Database=gerentall;Uid=${MARIADB_USER:-gerentall_app};Pwd=${MARIADB_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  dados_mariadb:
